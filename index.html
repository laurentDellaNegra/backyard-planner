<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Backyard Planner</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --panel-3: #273244;
      --border: #334155;
      --border-soft: #475569;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --muted-2: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
      --danger: #fb7185;
      --warning: #f59e0b;
      --ok: #34d399;
      --canvas: #f8fafc;
      --canvas-line: #dbe4ee;
      --canvas-major: #b7c4d1;
      --focus: #facc15;
      --shadow: 0 14px 40px rgba(0,0,0,.25);
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body, #root { width: 100%; max-width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: var(--font); color: var(--text); background: var(--bg); }

    button, input, select, textarea { font: inherit; max-width: 100%; min-width: 0; }
    button, select, input[type="checkbox"], input[type="color"], input[type="file"] { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tool-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--bg);
      min-width: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .top-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: linear-gradient(180deg, #111827, #0f172a);
      border-bottom: 1px solid var(--border);
      min-height: 46px;
      white-space: normal;
      flex-wrap: wrap;
      align-content: center;
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: .01em;
      min-width: 0;
      overflow: hidden;
    }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 7px;
      border-left: 1px solid rgba(148,163,184,.18);
      flex: 0 1 auto;
      flex-wrap: wrap;
      min-width: 0;
      overflow: hidden;
    }
    .toolbar-group:first-of-type { border-left: 0; }

    .btn, .icon-btn, .toggle-btn {
      border: 1px solid var(--border-soft);
      background: #1e293b;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 9px;
      min-height: 30px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      flex: 0 1 auto;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-btn { width: 32px; padding: 0; font-size: 15px; }
    .btn:hover, .icon-btn:hover, .toggle-btn:hover { background: #273244; border-color: #64748b; }
    .btn:active, .icon-btn:active, .toggle-btn:active { transform: translateY(1px); }
    .btn[disabled], .icon-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
    .btn[aria-pressed="true"], .toggle-btn[aria-pressed="true"], .tool-btn.active { background: #075985; border-color: var(--accent); color: white; }
    .toggle-btn.compact { min-width: 34px; padding: 6px 7px; }
    .danger { border-color: rgba(251,113,133,.55); color: #fecdd3; }
    .danger:hover { background: #4c1d2f; border-color: #fb7185; }

    .editor-layout {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) clamp(280px, 31vw, 360px);
      overflow: hidden;
      height: 100%;
      width: 100%;
      max-width: 100%;
    }

    .tool-palette {
      border-right: 1px solid var(--border);
      background: #0b1220;
      padding: 8px 7px;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
    }
    .tool-btn {
      width: 62px;
      min-height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #111827;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
      text-align: center;
      overflow: hidden;
    }
    .tool-btn:hover { background: #1f2937; border-color: #64748b; }
    .tool-icon { font-size: 18px; line-height: 18px; }
    .tool-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 10px; line-height: 1.1; color: var(--muted-2); }
    .tool-btn.active .tool-name { color: white; }
    .palette-divider { height: 1px; background: rgba(148,163,184,.16); margin: 3px 4px; }

    .workspace-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #020617;
      overflow: hidden;
    }
    .svg-workspace {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 35% 15%, #1e293b 0%, #0f172a 50%, #020617 100%);
      touch-action: none;
      cursor: crosshair;
    }
    .svg-workspace.select-cursor { cursor: default; }
    .svg-workspace.pan-cursor { cursor: grab; }
    .svg-workspace.panning { cursor: grabbing; }
    .workspace-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      pointer-events: none;
      max-width: calc(100% - 20px);
      overflow: hidden;
    }
    .pill {
      pointer-events: none;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,.78);
      border: 1px solid rgba(148,163,184,.3);
      color: #e2e8f0;
      font-size: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drawing-actions {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100% - 24px);
      overflow: hidden;
      background: rgba(15,23,42,.88);
      border: 1px solid rgba(148,163,184,.35);
      border-radius: 12px;
      padding: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .inspector {
      min-width: 0;
      border-left: 1px solid var(--border);
      background: #0b1220;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      width: 100%;
      max-width: 100%;
      min-height: 0;
    }
    .panel {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
      min-width: 0;
      max-width: 100%;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(148,163,184,.16);
      background: rgba(30,41,59,.5);
      font-weight: 700;
      color: #f8fafc;
      font-size: 13px;
      min-width: 0;
    }
    .panel-header > span:first-child, .panel-header h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-body { padding: 10px; min-width: 0; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; }
    .small { font-size: 12px; }
    .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row.wrap { flex-wrap: wrap; }
    .row.between { justify-content: space-between; flex-wrap: wrap; }
    .stack { display: grid; gap: 8px; min-width: 0; }
    .two-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 8px; }
    .three-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(92px, 100%), 1fr)); gap: 8px; }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field label { color: var(--muted-2); font-size: 11px; font-weight: 600; }
    .input, .select, .textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-soft);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 8px;
      min-height: 31px;
    }
    .textarea { resize: vertical; min-height: 72px; }
    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      color: var(--muted-2);
      font-size: 12px;
      min-width: 0;
    }
    .checkbox-line span { min-width: 0; overflow-wrap: anywhere; }
    .tailwind-palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 4px; padding: 5px; border: 1px solid var(--border); border-radius: 8px; background: #0f172a; min-width: 0; max-width: 100%; overflow: hidden; }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      min-height: 18px;
      max-height: 24px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 5px;
      padding: 0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }
    .color-swatch:hover { border-color: #f8fafc; transform: translateY(-1px); }
    .color-swatch.selected { outline: 2px solid var(--focus); outline-offset: 1px; }
    .color-swatch[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
    .warning-box {
      border: 1px solid rgba(245,158,11,.5);
      background: rgba(245,158,11,.1);
      color: #fde68a;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
    }
    .ok-box {
      border: 1px solid rgba(52,211,153,.45);
      background: rgba(16,185,129,.08);
      color: #bbf7d0;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
    }
    .layer-row, .inventory-row {
      display: grid;
      grid-template-columns: 26px 26px 1fr auto;
      gap: 6px;
      align-items: center;
      padding: 5px;
      border-radius: 9px;
      border: 1px solid transparent;
      min-width: 0;
    }
    .layer-row:hover, .inventory-row:hover { background: rgba(30,41,59,.45); border-color: rgba(148,163,184,.15); }
    .inventory-row { grid-template-columns: 1fr auto; font-size: 12px; color: var(--muted-2); }
    .layer-row span, .inventory-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.3);
      background: rgba(15,23,42,.75);
      color: var(--muted-2);
      font-size: 11px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .measure-list { display: grid; gap: 5px; font-size: 12px; color: var(--muted-2); }
    .measure-list div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed rgba(148,163,184,.16); padding-bottom: 4px; min-width: 0; }
    .measure-list span, .measure-list strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .measure-list div:last-child { border-bottom: 0; }
    .kbd {
      font-family: var(--mono);
      background: #020617;
      border: 1px solid #334155;
      border-bottom-color: #64748b;
      color: #e2e8f0;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 10px;
    }

    .status-bar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 86px) minmax(0, 145px) minmax(0, 118px);
      gap: 10px;
      align-items: center;
      padding: 4px 10px;
      background: #0b1220;
      border-top: 1px solid var(--border);
      color: var(--muted-2);
      font-size: 12px;
    }
    .status-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-bar > div { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal {
      width: min(760px, calc(100vw - 40px));
      max-height: min(780px, calc(100vh - 40px));
      overflow: auto;
      background: #111827;
      border: 1px solid #475569;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0; font-size: 18px; }
    .modal ol { margin-top: 8px; padding-left: 22px; color: var(--muted-2); }
    .modal li { margin: 6px 0; }

    .svg-label, .object-label { font-family: var(--font); paint-order: stroke; stroke: rgba(255,255,255,.8); stroke-width: 3px; stroke-linejoin: round; }
    .object-label { font-size: 13px; cursor: grab; pointer-events: auto; }
    .object-label:active { cursor: grabbing; }
    .measurement-label { font-family: var(--font); font-size: 11px; fill: #0f172a; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
    .draggable-measurement-label { pointer-events: auto; cursor: grab; }
    .draggable-measurement-label:active { cursor: grabbing; }
    .object-shape { transition: opacity .12s linear; }
    .object-shape:hover { filter: drop-shadow(0 0 4px rgba(14,165,233,.45)); }
    .handle { fill: #f8fafc; stroke: #0284c7; stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: grab; }
    .handle:hover { fill: #bae6fd; stroke: #0369a1; }
    .mid-handle { fill: #fef3c7; stroke: #d97706; stroke-width: 1.3; vector-effect: non-scaling-stroke; cursor: copy; }
    .segment-handle { fill: none; stroke: rgba(14,165,233,.001); stroke-width: 10; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
    .segment-handle:hover { stroke: rgba(14,165,233,.28); }
    .selected-segment { fill: none; stroke: #f97316; stroke-width: 3.5; vector-effect: non-scaling-stroke; stroke-dasharray: 6 4; pointer-events: stroke; cursor: pointer; }
    .resize-handle { fill: #f8fafc; stroke: #7c3aed; stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: nwse-resize; }
    .selection-outline { fill: none; stroke: #0284c7; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 7 4; pointer-events: none; }
    .hover-outline { fill: none; stroke: rgba(14,165,233,.75); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
    .invalid-outline { fill: none; stroke: #f59e0b; stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; pointer-events: none; }
    .selection-box { fill: rgba(14,165,233,.14); stroke: #0284c7; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; pointer-events: none; }
    .snap-guide { fill: none; stroke: #f97316; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; pointer-events: none; }
    .snap-dot { fill: #f97316; stroke: white; stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: none; }

    @media (max-width: 1050px) {
      .editor-layout { grid-template-columns: 68px minmax(0, 1fr) clamp(260px, 35vw, 320px); }
      .tool-palette { padding: 7px 5px; }
      .tool-btn { width: 56px; }
      .brand span { display: none; }
    }

    @media (max-width: 760px) {
      .editor-layout { grid-template-columns: 58px minmax(0, 1fr) clamp(220px, 39vw, 280px); }
      .tool-palette { padding: 6px 4px; }
      .tool-btn { width: 48px; min-height: 50px; border-radius: 10px; }
      .tool-name { font-size: 9px; }
      .inspector { padding: 8px; }
      .panel-body { padding: 8px; }
      .tailwind-palette { grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); }
      .status-bar { grid-template-columns: minmax(0, 1fr) minmax(0, 64px) minmax(0, 92px) minmax(0, 82px); gap: 6px; }
    }

    @media (max-width: 620px) {
      .editor-layout { grid-template-columns: 54px minmax(0, 1fr) clamp(190px, 43vw, 240px); }
      .tool-btn { width: 46px; }
      .top-toolbar { gap: 4px; padding-left: 6px; padding-right: 6px; }
      .toolbar-group { padding: 0 4px; }
      .panel-header { padding: 8px; }
      .status-bar { grid-template-columns: minmax(0, 1fr) minmax(0, 58px) minmax(0, 80px); }
      .status-bar > div:last-child { display: none; }
    }

    @media (max-width: 500px) {
      .editor-layout { grid-template-columns: 48px minmax(0, 1fr) clamp(168px, 45vw, 210px); }
      .tool-palette { padding: 5px 3px; }
      .tool-btn { width: 42px; min-height: 48px; }
      .tool-icon { font-size: 16px; }
      .tool-name { font-size: 8px; }
      .inspector { padding: 6px; }
      .panel-body { padding: 7px; }
      .tailwind-palette { grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 3px; padding: 4px; }
      .color-swatch { min-height: 14px; border-radius: 4px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

  <script id="app-source" type="text/plain">
    const { useEffect, useMemo, useReducer, useRef } = React;

    type Point = { x: number; y: number };
    type Layer = { id: string; name: string; visible: boolean; locked: boolean; order: number };
    type Style = { fill: string; stroke: string; strokeWidth: number; opacity: number; dash?: string };
    type ObjectType = "polygon" | "rectangle" | "circle" | "polyline" | "label";
    type ObjectKind = "property" | "polygon" | "rectangle" | "circle" | "line" | "sketch" | "label" | "area";
    type AttachedLabel = { visible: boolean; text: string; offset: Point; fontSizeM: number };
    type CommonObject = { id: string; type: ObjectType; kind: ObjectKind; name: string; layerId: string; locked: boolean; visible: boolean; style: Style; z: number; rotation?: number; measurementHidden?: boolean; hiddenMeasurements?: string[]; measurementOffsets?: Record<string, Point>; objectLabel?: AttachedLabel };
    type PolygonObject = CommonObject & { type: "polygon"; points: Point[] };
    type RectangleObject = CommonObject & { type: "rectangle"; x: number; y: number; width: number; height: number };
    type CircleObject = CommonObject & { type: "circle"; cx: number; cy: number; r: number };
    type PolylineObject = CommonObject & { type: "polyline"; points: Point[]; widthM?: number };
    type LabelObject = CommonObject & { type: "label"; x: number; y: number; text: string; fontSizeM: number };
    type PlanObject = PolygonObject | RectangleObject | CircleObject | PolylineObject | LabelObject;
    type Project = {
      id: string;
      name: string;
      workspace: { widthM: number; heightM: number };
      units: "m";
      layers: Layer[];
      objects: PlanObject[];
      settings: {
        showGrid: boolean;
        showMeasurements: boolean;
        snapToGrid: boolean;
        snapToVertices: boolean;
        snapToEdges: boolean;
        snapToMidpoints: boolean;
        orthogonalSnap: boolean;
      };
      savedAt?: string;
    };
    type Tool = "select" | "pan" | "property" | "polygon" | "line" | "rect" | "circle" | "sketch" | "label";
    type DragMode = "pan" | "move" | "vertex" | "midpoint" | "resize" | "radius" | "draw-rect" | "draw-circle" | "draw-freehand" | "select-box" | "measure-label" | "object-label";
    type MeasurementItem = { id: string; label: string; value: string; point: Point };
    type SelectedHandle = null | { objectId: string; kind: "vertex" | "segment" | "midpoint" | "resize" | "radius"; index?: number; corner?: string };
    type SnapResult = { point: Point; indicator?: { point: Point; label: string; line?: [Point, Point] } };
    type HistoryState = { project: Project; past: Project[]; future: Project[]; ui: UiState };
    type UiState = {
      tool: Tool;
      selectedIds: string[];
      hoveredId: string | null;
      selectedHandle: SelectedHandle;
      drawing: null | { tool: Tool; points: Point[]; preview?: Point; start?: Point; current?: Point };
      viewport: { scale: number; panX: number; panY: number };
      drag: null | any;
      spaceDown: boolean;
      snapIndicator?: SnapResult["indicator"];
      status: string;
      tests: { passed: number; total: number; failures: string[] };
      showChecklist: boolean;
    };

    const PX_PER_M = 10;
    const HISTORY_LIMIT = 80;
    const STORAGE_KEY = "backyard-planner-single-file-v1";
    const STARTER_PROJECT_URL = "plans/plan-terrain-v1.json";
    const FREEHAND_MIN_POINT_DISTANCE_M = .2;
    const FREEHAND_MAX_POINTS = 500;

    const fmtM = (n: number) => `${round1(n).toFixed(1)} m`;
    const fmtM2 = (n: number) => `${round1(n).toFixed(1)} m²`;
    const round1 = (n: number) => Math.round((Number.isFinite(n) ? n : 0) * 10) / 10;

    ].flatMap(group => group.shades.map((value, index) => ({ name: `${group.name}-${[50,100,200,300,400,500,600,700,800,900,950][index]}`, value })));

    function genericKindForObject(o: any): ObjectKind {
      if (o?.kind === "property") return "property";
      if (o?.kind === "sketch") return "sketch";
      if (o?.type === "label" || o?.kind === "label") return "label";
      if (o?.type === "rectangle") return "rectangle";
      if (o?.type === "circle") return "circle";
      if (o?.type === "polyline") return "line";
      if (o?.type === "polygon") return "polygon";
      return "polygon";
    }

    function displayObjectType(o: PlanObject | { type: ObjectType; kind?: ObjectKind }) {
      if (o.kind === "property") return "Property boundary";
      if (o.kind === "sketch") return "Hand-drawn line";
      if (o.type === "label") return "Text";
      if (o.type === "polyline") return "Line";
      return o.type[0].toUpperCase() + o.type.slice(1);
    }

    function isLineLike(o: PlanObject) {
      return o.type === "polyline" || o.kind === "sketch";
    }

    function objectColor(o: PlanObject) {
      const st = o.style || KIND_STYLE[o.kind] || KIND_STYLE.area;
      const stroke = st.stroke && st.stroke !== "none" ? st.stroke : "";
      const fill = st.fill && st.fill !== "none" ? st.fill : "";
      return stroke || fill || "#334155";
    }

    function makeInitialProject(): Project {
      const layers = defaultLayers();
      const property: PolygonObject = {
        id: "property-boundary",
        type: "polygon",
        kind: "property",
        name: "Property boundary",
        layerId: "property",
        locked: false,
        visible: true,
        style: KIND_STYLE.property,
        z: 0,
        rotation: 0,
        measurementHidden: false,
        hiddenMeasurements: [],
        measurementOffsets: {},
        objectLabel: { visible: false, text: "Property boundary", offset: { x: 0, y: -2 }, fontSizeM: 1.3 },
        points: [{x:0,y:0},{x:100,y:0},{x:100,y:100},{x:0,y:100}],
      };
      return {
        id: uid("project"),
        name: "Untitled backyard plan",
        workspace: { widthM: 100, heightM: 100 },
        units: "m",
        layers,
        objects: [property],
        settings: { showGrid: true, showMeasurements: true, snapToGrid: true, snapToVertices: true, snapToEdges: true, snapToMidpoints: true, orthogonalSnap: true },
      };
    }

    function isWorkspaceRectangle(points: Point[], workspace: Project["workspace"]) {
      const expected = [{x:0,y:0},{x:workspace.widthM,y:0},{x:workspace.widthM,y:workspace.heightM},{x:0,y:workspace.heightM}];
      return points.length === expected.length && points.every((p, i) => almost(p.x, expected[i].x) && almost(p.y, expected[i].y));
    }

    function workspaceRectanglePoints(workspace: Project["workspace"]) {
      return [{x:0,y:0},{x:workspace.widthM,y:0},{x:workspace.widthM,y:workspace.heightM},{x:0,y:workspace.heightM}];
    }

    function resizeWorkspace(project: Project, workspace: Project["workspace"]): Project {
      return {
        ...project,
        workspace,
        objects: project.objects.map(o => {
          if (o.id === "property-boundary" && o.type === "polygon" && isWorkspaceRectangle(o.points, project.workspace)) {
            return { ...o, points: workspaceRectanglePoints(workspace) };
          }
          return o;
        })
      };
    }

    function expandWorkspaceToPropertyBoundary(project: Project): Project {
      const boundary = project.objects.find(o => o.id === "property-boundary" && o.type === "polygon") as PolygonObject | undefined;
      if (!boundary) return project;
      const maxX = Math.max(project.workspace.widthM, ...boundary.points.map(p => p.x));
      const maxY = Math.max(project.workspace.heightM, ...boundary.points.map(p => p.y));
      const workspace = {
        widthM: round1(clamp(maxX, 5, 500)),
        heightM: round1(clamp(maxY, 5, 500)),
      };
      if (almost(workspace.widthM, project.workspace.widthM) && almost(workspace.heightM, project.workspace.heightM)) return project;
      return { ...project, workspace };
    }

    function normalizePoint(input: any, fallback: Point = { x: 0, y: 0 }): Point {
      return { x: round1(Number(input?.x) || fallback.x), y: round1(Number(input?.y) || fallback.y) };
    }

    function normalizeMeasurementOffsets(input: any): Record<string, Point> {
      if (!input || typeof input !== "object") return {};
      return Object.fromEntries(Object.entries(input).map(([key, value]) => [key, normalizePoint(value)]));
    }

    function normalizeObjectLabel(o: any, kind: ObjectKind): AttachedLabel {
      const incoming = o?.objectLabel;
      if (incoming && typeof incoming === "object") {
        return {
          visible: !!incoming.visible,
          text: String(incoming.text || o?.name || KIND_LABELS[kind]),
          offset: normalizePoint(incoming.offset, { x: 0, y: -2 }),
          fontSizeM: Math.max(.3, round1(Number(incoming.fontSizeM) || 1.3)),
        };
      }
      return { visible: false, text: String(o?.name || KIND_LABELS[kind]), offset: { x: 0, y: -2 }, fontSizeM: 1.3 };
    }

    function normalizedProject(input: any): Project {
      if (!input || typeof input !== "object") throw new Error("Invalid project JSON.");
      const p = input as Project;
      if (!p.workspace || !Array.isArray(p.objects)) throw new Error("The JSON does not look like a Backyard Planner project.");
      return expandWorkspaceToPropertyBoundary({
        id: p.id || uid("project"),
        name: p.name || "Imported backyard plan",
        workspace: { widthM: Number(p.workspace.widthM) || 100, heightM: Number(p.workspace.heightM) || 100 },
        units: "m",
        layers: defaultLayers(),
        objects: p.objects.map((o: any, i: number) => {
          const kind = genericKindForObject(o);
          const style = { ...(KIND_STYLE[kind] || KIND_STYLE.polygon), ...(o.style || {}) };
          const color = style.stroke && style.stroke !== "none" ? style.stroke : (style.fill && style.fill !== "none" ? style.fill : objectColor({ ...o, kind, style } as PlanObject));
          const normalizedStyle = { ...style, stroke: color, fill: (kind === "line" || kind === "sketch") ? "none" : color };
          if (kind === "property") normalizedStyle.fill = style.fill || KIND_STYLE.property.fill;
          return {
            visible: true,
            locked: false,
            z: i,
            ...o,
            kind,
            layerId: KIND_LAYER[kind],
            style: normalizedStyle,
            rotation: normalizeRotation(Number(o.rotation) || 0),
            measurementHidden: !!o.measurementHidden,
            hiddenMeasurements: Array.isArray(o.hiddenMeasurements) ? o.hiddenMeasurements : [],
            measurementOffsets: normalizeMeasurementOffsets(o.measurementOffsets),
            objectLabel: normalizeObjectLabel(o, kind),
          } as PlanObject;
        }),
        settings: { ...makeInitialProject().settings, ...(p.settings || {}) },
        savedAt: p.savedAt,
      });
    }

    function createObjectForTool(tool: Tool, points: Point[], extra: any = {}): PlanObject | null {
      const kindMap: Partial<Record<Tool, ObjectKind>> = {
        property: "property", polygon: "polygon", line: "line", rect: "rectangle", circle: "circle", sketch: "sketch", label: "label"
      };
      const kind = kindMap[tool] || "area";
      const base = {
        id: uid(kind), kind, name: `${KIND_LABELS[kind]} ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`,
        layerId: KIND_LAYER[kind], locked: false, visible: true, style: deepClone(KIND_STYLE[kind]), z: Date.now()
      } as any;
      base.rotation = 0;
      base.measurementHidden = false;
      base.hiddenMeasurements = [];
      base.measurementOffsets = {};
      base.objectLabel = { visible: false, text: KIND_LABELS[kind], offset: { x: 0, y: -2 }, fontSizeM: 1.3 };
      if (["polygon","property"].includes(tool)) {
        if (points.length < 3) return null;
        return { ...base, type: "polygon", points: points.map(p => ({ x: round1(p.x), y: round1(p.y) })) } as PolygonObject;
      }
      if (tool === "line") {
        if (points.length < 2) return null;
        return { ...base, type: "polyline", points: points.map(p => ({ x: round1(p.x), y: round1(p.y) })), widthM: 0 } as PolylineObject;
      }
      if (tool === "sketch") {
        const clean = points.reduce((acc: Point[], p) => {
          const next = { x: round1(p.x), y: round1(p.y) };
          const last = acc[acc.length - 1];
          if (!last || distance(last, next) >= .1) acc.push(next);
          return acc;
        }, []);
        if (clean.length < 2 || pathLength(clean) < .2) return null;
        return { ...base, type: "polyline", points: clean, widthM: 0 } as PolylineObject;
      }
      if (tool === "rect") {
        const start = points[0], end = points[1] || points[0];
        const x = Math.min(start.x, end.x), y = Math.min(start.y, end.y), w = Math.abs(end.x - start.x), h = Math.abs(end.y - start.y);
        if (w < .2 || h < .2) return null;
        return { ...base, type: "rectangle", x: round1(x), y: round1(y), width: round1(w), height: round1(h) } as RectangleObject;
      }
      if (tool === "circle") {
        const start = points[0], end = points[1] || { x: start.x + 2.5, y: start.y };
        const defaultR = 2.5;
        const r = Math.max(.2, distance(start, end) || defaultR);
        return { ...base, type: "circle", cx: round1(start.x), cy: round1(start.y), r: round1(r) } as CircleObject;
      }
      if (tool === "label") {
        const p = points[0];
        return { ...base, type: "label", x: round1(p.x), y: round1(p.y), text: extra.text || "Label", fontSizeM: 1.5 } as LabelObject;
      }
      return null;
    }

    function getLayer(project: Project, layerId: string) { return project.layers.find(l => l.id === layerId); }
    function isEditable(project: Project, o: PlanObject | undefined | null) {
      if (!o) return false;
      const layer = getLayer(project, o.layerId);
      return !o.locked && !!layer && !layer.locked && layer.visible && o.visible;
    }
    function visibleObjects(project: Project) {
      const layerMap = new Map(project.layers.map(l => [l.id, l]));
      return project.objects
        .filter(o => o.visible && layerMap.get(o.layerId)?.visible)
        .sort((a,b) => (layerMap.get(a.layerId)?.order ?? 0) - (layerMap.get(b.layerId)?.order ?? 0) || a.z - b.z);
    }
    function selectedObjects(project: Project, ids: string[]) { return project.objects.filter(o => ids.includes(o.id)); }

    function updateObject(project: Project, objectId: string, patcher: (o: PlanObject) => PlanObject): Project {
      return { ...project, objects: project.objects.map(o => o.id === objectId ? patcher(o) : o) };
    }
    function updateObjects(project: Project, ids: string[], patcher: (o: PlanObject) => PlanObject): Project {
      return { ...project, objects: project.objects.map(o => ids.includes(o.id) ? patcher(o) : o) };
    }

    function collectSnapTargets(project: Project, excludeIds: string[] = []) {
      const vertices: Point[] = [];
      const edges: [Point, Point][] = [];
      const mids: Point[] = [];
      for (const o of visibleObjects(project)) {
        if (excludeIds.includes(o.id)) continue;
        if (o.kind === "sketch") continue;
        vertices.push(...getObjectVertices(o));
        const objEdges = getObjectEdges(o);
        edges.push(...objEdges);
        mids.push(...objEdges.map(([a,b]) => midpoint(a,b)));
      }
      return { vertices, edges, mids };
    }

    function applySnapping(project: Project, point: Point, context: { base?: Point; excludeIds?: string[]; allowOutsideWorkspace?: boolean } = {}): SnapResult {
      let p = { ...point };
      let indicator: SnapResult["indicator"] | undefined;
      const settings = project.settings;
      if (settings.snapToGrid) {
        const snapped = { x: Math.round(p.x), y: Math.round(p.y) };
        if (distance(snapped, p) <= .35) {
          p = snapped;
          indicator = { point: p, label: "Grid" };
        }
      }
      const targets = collectSnapTargets(project, context.excludeIds || []);
      if (settings.snapToVertices) {
        let best: { point: Point; dist: number } | null = null;
        for (const v of targets.vertices) {
          const d = distance(p, v);
          if (d <= .45 && (!best || d < best.dist)) best = { point: v, dist: d };
        }
        if (best) { p = { ...best.point }; indicator = { point: p, label: "Vertex" }; }
      }
      if (settings.snapToMidpoints) {
        let best: { point: Point; dist: number } | null = null;
        for (const v of targets.mids) {
          const d = distance(p, v);
          if (d <= .45 && (!best || d < best.dist)) best = { point: v, dist: d };
        }
        if (best) { p = { ...best.point }; indicator = { point: p, label: "Midpoint" }; }
      }
      if (settings.snapToEdges) {
        let best: { point: Point; dist: number; edge: [Point,Point] } | null = null;
        for (const [a,b] of targets.edges) {
          const proj = projectPointOnSegment(p, a, b);
          if (proj.dist <= .35 && (!best || proj.dist < best.dist)) best = { point: proj.point, dist: proj.dist, edge: [a,b] };
        }
        if (best) { p = { x: round1(best.point.x), y: round1(best.point.y) }; indicator = { point: p, label: "Edge", line: best.edge }; }
      }
      if (settings.orthogonalSnap && context.base) {
        const dx = Math.abs(p.x - context.base.x), dy = Math.abs(p.y - context.base.y);
        if (dx > .15 || dy > .15) {
          if (dx < dy * .23) {
            p.x = context.base.x;
            indicator = { point: p, label: "90°", line: [context.base, p] };
          } else if (dy < dx * .23) {
            p.y = context.base.y;
            indicator = { point: p, label: "180°", line: [context.base, p] };
          }
        }
      }
      p.x = context.allowOutsideWorkspace ? round1(Math.max(0, p.x)) : round1(clamp(p.x, 0, project.workspace.widthM));
      p.y = context.allowOutsideWorkspace ? round1(Math.max(0, p.y)) : round1(clamp(p.y, 0, project.workspace.heightM));
      return { point: p, indicator };
    }

    function deriveQuantities(project: Project) {
      const q = { polygonArea: 0, rectangleArea: 0, circleArea: 0, lineLength: 0, sketchLength: 0, textCount: 0, inventory: [] as { id: string; name: string; value: string }[] };
      for (const o of project.objects) {
        if (o.kind === "property" || !o.visible) continue;
        const m = objectMeasurements(o) as any;
        if (o.type === "polygon") q.polygonArea += m.area || 0;
        if (o.type === "rectangle") q.rectangleArea += m.area || 0;
        if (o.type === "circle") q.circleArea += m.area || 0;
        if (o.type === "polyline" && o.kind === "sketch") q.sketchLength += m.length || 0;
        else if (o.type === "polyline") q.lineLength += m.length || 0;
        if (o.type === "label") q.textCount += 1;
        let value = "";
        if (m.area) value = fmtM2(m.area);
        else if (m.length) value = fmtM(m.length);
        else if (o.type === "circle") value = `Ø ${fmtM(o.r * 2)}`;
        else if (o.type === "label") value = o.text;
        q.inventory.push({ id: o.id, name: `${displayObjectType(o)} · ${o.name}`, value });
      }
      return q;
    }

    function downloadText(filename: string, text: string, type = "application/json") {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function escapeXml(s: string) {
      return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c] || c));
    }

    function renderObjectAsSvg(o: PlanObject, project: Project, exportMode = false) {
      const st = o.style || KIND_STYLE[o.kind] || KIND_STYLE.area;
      const color = objectColor(o);
      const strokeWidth = mToPx(st.strokeWidth || .1);
      const opacity = st.opacity ?? 1;
      const transform = objectTransform(o);
      const transformAttr = transform ? ` transform="${transform}"` : "";
      const fill = o.kind === "property" ? (st.fill || "none") : (isLineLike(o) ? "none" : color);
      if (o.type === "polygon") {
        return `<polygon points="${ptsAttr(o.points)}" fill="${fill}" stroke="${color}" stroke-width="${strokeWidth}" opacity="${opacity}" ${st.dash ? `stroke-dasharray="${st.dash}"` : ""}/>`;
      }
      if (o.type === "rectangle") {
        return `<rect x="${mToPx(o.x)}" y="${mToPx(o.y)}" width="${mToPx(o.width)}" height="${mToPx(o.height)}" fill="${fill}" stroke="${color}" stroke-width="${strokeWidth}" opacity="${opacity}"${transformAttr}/>`;
      }
      if (o.type === "circle") {
        const shape = `<circle cx="${mToPx(o.cx)}" cy="${mToPx(o.cy)}" r="${mToPx(o.r)}" fill="${fill}" stroke="${color}" stroke-width="${strokeWidth}" opacity="${opacity}"/>`;
        return transform ? `<g${transformAttr}>${shape}</g>` : shape;
      }
      if (o.type === "polyline") {
        const width = Math.max(strokeWidth, 2);
        return `<polyline points="${ptsAttr(o.points)}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>`;
      }
      if (o.type === "label") {
        return `<text x="${mToPx(o.x)}" y="${mToPx(o.y)}" font-family="system-ui, sans-serif" font-size="${mToPx(o.fontSizeM)}" fill="${color}" stroke="white" stroke-width="3" paint-order="stroke"${transformAttr}>${escapeXml(o.text)}</text>`;
      }
      return "";
    }

    function renderObjectLabelAsSvg(o: PlanObject) {
      if (o.type === "label" || !o.objectLabel?.visible) return "";
      const p = objectLabelPosition(o);
      return `<text x="${mToPx(p.x)}" y="${mToPx(p.y)}" font-family="system-ui, sans-serif" font-size="${mToPx(o.objectLabel.fontSizeM || 1.3)}" fill="${objectColor(o)}" stroke="white" stroke-width="3" paint-order="stroke" text-anchor="middle">${escapeXml(o.objectLabel.text || o.name)}</text>`;
    }

    function renderMeasurementsAsSvg(o: PlanObject) {
      const text = (p: Point, label: string) => `<text x="${mToPx(p.x)}" y="${mToPx(p.y)}" font-family="system-ui, sans-serif" font-size="12" fill="${objectColor(o)}" stroke="white" stroke-width="3" paint-order="stroke" text-anchor="middle">${escapeXml(label)}</text>`;
      return objectMeasurementItems(o).map(item => text(item.point, item.value)).join("");
    }

    async function exportProjectPng(project: Project) {
      const widthPx = mToPx(project.workspace.widthM), heightPx = mToPx(project.workspace.heightM);
      let grid = `<rect x="0" y="0" width="${widthPx}" height="${heightPx}" fill="#f8fafc"/>`;
      if (project.settings.showGrid) {
        for (let x = 0; x <= project.workspace.widthM; x += 1) grid += `<line x1="${mToPx(x)}" y1="0" x2="${mToPx(x)}" y2="${heightPx}" stroke="${x % 10 === 0 ? "#b7c4d1" : "#dbe4ee"}" stroke-width="${x % 10 === 0 ? 1.2 : .55}"/>`;
        for (let y = 0; y <= project.workspace.heightM; y += 1) grid += `<line x1="0" y1="${mToPx(y)}" x2="${widthPx}" y2="${mToPx(y)}" stroke="${y % 10 === 0 ? "#b7c4d1" : "#dbe4ee"}" stroke-width="${y % 10 === 0 ? 1.2 : .55}"/>`;
      }
      const objs = visibleObjects(project).map(o => renderObjectAsSvg(o, project, true)).join("\n");
      const measurements = project.settings.showMeasurements ? visibleObjects(project).filter(o => o.kind !== "label").map(renderMeasurementsAsSvg).join("\n") : "";
      const labels = visibleObjects(project).map(renderObjectLabelAsSvg).join("\n");
      const title = `<text x="16" y="28" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a" font-weight="700">${escapeXml(project.name)}</text><text x="16" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#334155">${fmtM(project.workspace.widthM)} × ${fmtM(project.workspace.heightM)}</text>`;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${widthPx}" height="${heightPx}" viewBox="0 0 ${widthPx} ${heightPx}">${grid}<g>${objs}</g><g>${measurements}</g><g>${labels}</g>${title}</svg>`;
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      const loaded = new Promise<void>((resolve, reject) => { img.onload = () => resolve(); img.onerror = reject; });
      img.src = url;
      await loaded;
      const canvas = document.createElement("canvas");
      canvas.width = widthPx;
      canvas.height = heightPx;
      const ctx = canvas.getContext("2d")!;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,widthPx,heightPx);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      const png = await new Promise<Blob | null>(resolve => canvas.toBlob(resolve, "image/png"));
      if (!png) throw new Error("PNG export failed.");
      const pngUrl = URL.createObjectURL(png);
      const a = document.createElement("a");
      a.href = pngUrl;
      a.download = `${project.name.replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "") || "backyard-plan"}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
    }

    function runGeometryTests() {
      const tests: [string, () => boolean][] = [
        ["meters-to-pixels", () => mToPx(3.2) === 32],
        ["pixels-to-meters", () => pxToM(25) === 2.5],
        ["rounding", () => round1(12.34) === 12.3 && round1(12.35) === 12.4],
        ["point rotation", () => { const p = rotatePointAround({x:1,y:0}, {x:0,y:0}, 90); return p.x === 0 && p.y === 1; }],
        ["grid snapping", () => applySnapping(makeInitialProject(), {x: 4.88, y: 5.11}, {}).point.x === 5],
        ["orthogonal snapping", () => applySnapping(makeInitialProject(), {x: 10.2, y: 25}, {base:{x:10,y:10}}).point.x === 10],
        ["midpoint", () => midpoint({x:0,y:0},{x:4,y:2}).x === 2 && midpoint({x:0,y:0},{x:4,y:2}).y === 1],
        ["polygon perimeter", () => round1(polygonPerimeter([{x:0,y:0},{x:3,y:0},{x:3,y:4}])) === 12],
        ["polygon area", () => polygonArea([{x:0,y:0},{x:10,y:0},{x:10,y:10},{x:0,y:10}]) === 100],
        ["self-intersection", () => polygonSelfIntersects([{x:0,y:0},{x:4,y:4},{x:0,y:4},{x:4,y:0}]) === true],
        ["path length", () => pathLength([{x:0,y:0},{x:3,y:4},{x:6,y:4}]) === 8],
        ["segment deletion", () => {
          const next = deleteSegmentFromObject({type:"polyline", id:"s", kind:"line", name:"s", layerId:"shapes", locked:false, visible:true, style:KIND_STYLE.line, z:0, points:[{x:0,y:0},{x:1,y:0},{x:2,y:0}]}, 0) as PolylineObject | null;
          return !!next && next.points.length === 2 && next.points[0].x === 1 && next.points[1].x === 2;
        }],
        ["rectangle measurement", () => rectArea({type:"rectangle", id:"t", kind:"rectangle", name:"r", layerId:"shapes", locked:false, visible:true, style:KIND_STYLE.rectangle, z:0, x:0,y:0,width:5,height:4}) === 20],
        ["hidden measurement", () => objectMeasurementItems({type:"rectangle", id:"h", kind:"rectangle", name:"h", layerId:"shapes", locked:false, visible:true, style:KIND_STYLE.rectangle, z:0, x:0,y:0,width:5,height:4, hiddenMeasurements:["width"]}).length === 2],
        ["circle measurement", () => round1(circlePerimeter({type:"circle", id:"c", kind:"circle", name:"c", layerId:"shapes", locked:false, visible:true, style:KIND_STYLE.circle, z:0, cx:0,cy:0,r:2})) === 12.6],
      ];
      const failures: string[] = [];
      tests.forEach(([name, fn]) => { try { if (!fn()) failures.push(name); } catch (e) { failures.push(`${name}: ${(e as Error).message}`); } });
      return { passed: tests.length - failures.length, total: tests.length, failures };
    }

    async function loadStarterProject() {
      const response = await fetch(STARTER_PROJECT_URL, { cache: "no-cache" });
      if (!response.ok) throw new Error(`Could not load ${STARTER_PROJECT_URL} (${response.status}).`);
      return normalizedProject(await response.json());

    function appReducer(state: HistoryState, action: any): HistoryState {
      const push = (incoming: Project, status?: string) => {
        const next = expandWorkspaceToPropertyBoundary(incoming);
        const currentStr = JSON.stringify(state.project);
        const nextStr = JSON.stringify(next);
        if (currentStr === nextStr) return { ...state, ui: { ...state.ui, status: status || state.ui.status } };
        const past = [...state.past, state.project].slice(-HISTORY_LIMIT);
        return { ...state, project: next, past, future: [], ui: { ...state.ui, status: status || state.ui.status } };
      };
      switch (action.type) {
        case "SET_TOOL":
          return { ...state, ui: { ...state.ui, tool: action.tool, drawing: null, selectedHandle: null, status: action.status || `${action.tool} tool active.` } };
        case "SET_UI":
          return { ...state, ui: { ...state.ui, ...action.patch } };
        case "PROJECT_APPLY":
          return push(action.project, action.status);
        case "PROJECT_TRANSIENT":
          return { ...state, project: expandWorkspaceToPropertyBoundary(action.project), ui: { ...state.ui, status: action.status || state.ui.status } };
        case "PROJECT_COMMIT_FROM": {
          const changed = JSON.stringify(action.beforeProject) !== JSON.stringify(state.project);
          if (!changed) return { ...state, ui: { ...state.ui, drag: null } };
          return { ...state, past: [...state.past, action.beforeProject].slice(-HISTORY_LIMIT), future: [], ui: { ...state.ui, drag: null, status: action.status || "Edit committed." } };
        }
        case "UNDO": {
          if (!state.past.length) return state;
          const prev = state.past[state.past.length - 1];
          return { ...state, project: prev, past: state.past.slice(0, -1), future: [state.project, ...state.future], ui: { ...state.ui, drawing: null, selectedHandle: null, status: "Undo." } };
        }
        case "REDO": {
          if (!state.future.length) return state;
          const next = state.future[0];
          return { ...state, project: next, past: [...state.past, state.project].slice(-HISTORY_LIMIT), future: state.future.slice(1), ui: { ...state.ui, drawing: null, selectedHandle: null, status: "Redo." } };
        }
        case "NEW_PROJECT":
          return { project: makeInitialProject(), past: [], future: [], ui: { ...state.ui, selectedIds: [], selectedHandle: null, drawing: null, status: "New project created." } };
        case "IMPORT_PROJECT":
          return { project: expandWorkspaceToPropertyBoundary(action.project), past: [state.project].slice(-HISTORY_LIMIT), future: [], ui: { ...state.ui, selectedIds: [], selectedHandle: null, drawing: null, status: action.status || "Project imported." } };
        default:
          return state;
      }
    }

    function IconButton({ label, title, children, onClick, disabled=false, pressed, className="" }: any) {

      if (pressed !== undefined) props["aria-pressed"] = pressed;

    function TopToolbar({ state, dispatch, fitWorkspace }: { state: HistoryState; dispatch: any; fitWorkspace: () => void }) {
      const { project, past, future, ui } = state;
      const fileRef = useRef<HTMLInputElement | null>(null);
      const applyProject = (project: Project, status?: string) => dispatch({ type: "PROJECT_APPLY", project, status });
      const toggleSetting = (key: keyof Project["settings"]) => applyProject({ ...project, settings: { ...project.settings, [key]: !project.settings[key] } }, `${key} ${project.settings[key] ? "off" : "on"}.`);
      const exportJson = () => downloadText(`${project.name.replace(/[^a-z0-9]+/gi,"-") || "backyard-plan"}.json`, JSON.stringify({ ...project, savedAt: new Date().toISOString() }, null, 2));
      const importJson = (file: File) => {
        const reader = new FileReader();
        reader.onload = () => {
          try { dispatch({ type: "IMPORT_PROJECT", project: normalizedProject(JSON.parse(String(reader.result))) }); }
          catch(e) { dispatch({ type: "SET_UI", patch: { status: `Import failed: ${(e as Error).message}` } }); }
        };
        reader.readAsText(file);
      };
      const save = () => {
        const saved = { ...project, savedAt: new Date().toISOString() };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        applyProject(saved, "Project saved to localStorage.");
      };
      const loadPlanV1 = async () => {
        if (!confirm("Load plan v1? This will replace the current project and then autosave it in this browser.")) return;
        dispatch({ type:"SET_UI", patch:{ status:"Loading plan v1..." } });
        try {
          dispatch({ type:"IMPORT_PROJECT", project:await loadStarterProject(), status:"Plan v1 loaded." });
        } catch (e) {
          dispatch({ type:"SET_UI", patch:{ status:`Plan v1 load failed: ${(e as Error).message}` } });
        }
      };
      const zoom = (factor: number) => dispatch({ type: "SET_UI", patch: { viewport: { ...ui.viewport, scale: clamp(ui.viewport.scale * factor, .15, 6) }, status: `Zoom ${Math.round(clamp(ui.viewport.scale * factor, .15, 6) * 100)}%.` } });

      return <div className="top-toolbar" role="toolbar" aria-label="Project toolbar">
        <div className="brand"><span className="brand-mark" aria-hidden="true"></span><span>Backyard Planner</span></div>
        <div className="toolbar-group">
          <button className="btn" title="Create a new empty project" onClick={() => { if (confirm("Create a new project? Unsaved changes remain only in browser history/autosave.")) dispatch({ type: "NEW_PROJECT" }); }}>New</button>
          <button className="btn" title="Load plans/plan-terrain-v1.json" onClick={loadPlanV1}>Load Plan v1</button>
          <button className="btn" title="Save to this browser's localStorage" onClick={save}>Save</button>
        </div>
        <div className="toolbar-group">
          <IconButton label="Undo" title="Undo (Ctrl/Cmd+Z)" disabled={!past.length} onClick={() => dispatch({type:"UNDO"})}>↶</IconButton>
          <IconButton label="Redo" title="Redo (Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y)" disabled={!future.length} onClick={() => dispatch({type:"REDO"})}>↷</IconButton>
        </div>
        <div className="toolbar-group">
          <IconButton label="Zoom out" title="Zoom out" onClick={() => zoom(.82)}>−</IconButton>
          <span className="chip" aria-label="Current zoom">{Math.round(ui.viewport.scale * 100)}%</span>
          <IconButton label="Zoom in" title="Zoom in" onClick={() => zoom(1.22)}>＋</IconButton>
          <button className="btn" title="Fit workspace" onClick={fitWorkspace}>Fit</button>
        </div>
        <div className="toolbar-group" aria-label="View and snap toggles">
          <IconButton label="Toggle grid" title="Grid" pressed={project.settings.showGrid} onClick={() => toggleSetting("showGrid")}>▦</IconButton>
          <IconButton label="Toggle measurements" title="Measurements" pressed={project.settings.showMeasurements} onClick={() => toggleSetting("showMeasurements")}>⌁</IconButton>
          <IconButton label="Toggle grid snap" title="Snap to grid" pressed={project.settings.snapToGrid} onClick={() => toggleSetting("snapToGrid")}>#</IconButton>
          <IconButton label="Toggle vertex snap" title="Snap to vertices" pressed={project.settings.snapToVertices} onClick={() => toggleSetting("snapToVertices")}>●</IconButton>
          <IconButton label="Toggle edge snap" title="Snap to edges" pressed={project.settings.snapToEdges} onClick={() => toggleSetting("snapToEdges")}>╱</IconButton>
          <IconButton label="Toggle midpoint snap" title="Snap to midpoints" pressed={project.settings.snapToMidpoints} onClick={() => toggleSetting("snapToMidpoints")}>◇</IconButton>
          <IconButton label="Toggle orthogonal snap" title="Orthogonal 90°/180° snap" pressed={project.settings.orthogonalSnap} onClick={() => toggleSetting("orthogonalSnap")}>⟂</IconButton>
        </div>
        <div className="toolbar-group">
          <button className="btn" title="Export full editable project JSON" onClick={exportJson}>Export JSON</button>
          <button className="btn" title="Import project JSON" onClick={() => fileRef.current?.click()}>Import JSON</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={(e) => e.target.files?.[0] && importJson(e.target.files[0])} />

    function ToolPalette({ tool, dispatch }: { tool: Tool; dispatch: any }) {
      return <aside className="tool-palette" aria-label="Drawing tools">
        {TOOL_GROUPS.map((group, gi) => <React.Fragment key={gi}>
          {gi > 0 && <div className="palette-divider" />}
          {group.tools.map(t => <button key={t.tool} className={`tool-btn ${tool === t.tool ? "active" : ""}`} aria-label={t.title} title={t.title} onClick={() => dispatch({ type:"SET_TOOL", tool:t.tool, status:`${t.name} tool active.` })}>

          </button>)}
